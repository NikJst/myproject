<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль пользователя</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="Styles.css" />
    <style>
      .posts-container {
        max-height: calc(100vh - 280px);
        overflow-y: auto;
      }

      .posts-container::-webkit-scrollbar {
        width: 8px;
      }

      .posts-container::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }

      .posts-container::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 10px;
      }

      .posts-container::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

      .post-card {
        transition:
          transform 0.2s ease-in-out,
          box-shadow 0.2s ease-in-out;
      }

      .post-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <!-- Заголовок профиля -->
    <header class="bg-white shadow-md border-b border-gray-200">
      <div class="container mx-auto px-4 py-6">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-6">
            <!-- Информация о пользователе -->
            <div>
              <h1 class="text-3xl font-bold text-gray-800 mb-1">Иван Петров</h1>
              <p class="text-gray-600 mb-2">@ivan_petrov</p>
              <p class="text-gray-700 text-sm max-w-md">
                Веб-разработчик, увлекаюсь фотографиями и путешествиями. Люблю
                делиться интересными моментами из жизни.
              </p>
            </div>
          </div>

          <!-- Кнопки действий -->
          <div class="flex space-x-3">
            <button
              class="px-6 py-0.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200"
            >
              <i class="fas fa-edit"></i>Изменить
            </button>
            <!-- <button
              class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors duration-200 font-medium"
            >
              <i class="fas fa-cog mr-2"></i>Настройки
            </button> -->
          </div>
        </div>

        <!-- контейнер для кнопок действий -->
        <div class="action-buttons-container"></div>

        <!-- Статистика -->
        <div class="flex space-x-8 mt-6 pt-6 border-t border-gray-200">
          <div class="text-center">
            <div class="text-2xl font-bold text-gray-800">15</div>
            <div class="text-gray-600 text-sm">Постов</div>
          </div>
          <div class="text-center">
            <div class="text-2xl font-bold text-gray-800">2.3K</div>
            <div class="text-gray-600 text-sm">Понравившиеся</div>
          </div>
          <div class="text-center">
            <div class="text-2xl font-bold text-gray-800">489</div>
            <div class="text-gray-600 text-sm">Избранное</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Контейнер с постами -->
    <main class="container mx-auto px-4 py-8">
      <div class="bg-white rounded-lg shadow-md">
        <!-- Заголовок секции постов -->
        <div class="px-6 py-4 border-b border-gray-200">
          <h2 class="text-xl font-semibold text-gray-800">
            <i class="fas fa-newspaper mr-2 text-blue-600"></i>
            Мои карточки
          </h2>
        </div>

        <!-- Контейнер с прокруткой для постов -->
        <div class="posts-container p-6">
          <!-- Посты будут добавлены динамически -->
        </div>
      </div>
    </main>

    <script type="module">
      // Импортируем функции создания кнопок и формы добавления поста
      import {
        createAddPostButton,
        createPostForm,
      } from "./CardForm.js";
      
      // Импортируем функцию создания карточек и загрузки постов
      import { createEmptyPostCard, loadAllPosts } from "./Post.js";
      
      // Импортируем навигационные кнопки
      import { createNavigationButtons } from "./NavigationButtons.js";

      // Создаем кнопки при загрузке страницы
      document.addEventListener("DOMContentLoaded", function () {
        console.log("Profile page loaded");
        
        createAddPostButton();
        createPostForm();
        createNavigationButtons();
        
        // Делаем функцию доступной глобально для других скриптов
        window.createEmptyPostCard = createEmptyPostCard;
        
        // Загружаем все посты при загрузке профиля
        console.log("Calling loadAllPosts...");
        loadAllPosts().then(() => {
          console.log("loadAllPosts completed");
        }).catch(error => {
          console.error("loadAllPosts failed:", error);
        });
      });

      // Добавление интерактивности для кнопок лайков (включая динамически созданные)
      function setupLikeButtons() {
        document.querySelectorAll(".buttons-bottom button").forEach((button) => {
          // Проверяем, что это кнопка лайка (содержит img или i с heart)
          const isLikeButton = button.querySelector('img[src*="like"], .fa-heart');
          
          if (isLikeButton && !button.hasAttribute('data-like-setup')) {
            button.setAttribute('data-like-setup', 'true');
            button.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              
              // Получаем postId из data-атрибута
              const postId = this.dataset.postId;
              if (postId) {
                // Отправляем запрос на сервер для переключения лайка
                toggleLikeOnServer(postId, this);
              }
            });
          }
        });
      }

      // Функция для отправки запроса на сервер
      async function toggleLikeOnServer(postId, buttonElement) {
        try {
          const response = await fetch("/api/Like", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ postId: postId })
          });
          
          if (response.ok) {
            const result = await response.json();
            // Обновляем интерфейс на основе ответа от сервера
            updateLikeButton(buttonElement, result.likedByUser, result.likesCount);
          }
        } catch (error) {
          console.error("Error toggling like:", error);
        }
      }

      // Функция для обновления кнопки лайка на основе ответа сервера
      function updateLikeButton(buttonElement, isLiked, likesCount) {
        // Для Font Awesome иконок (posts-container)
        const icon = buttonElement.querySelector("i");
        if (icon) {
          if (isLiked) {
            icon.classList.remove("far");
            icon.classList.add("fas", "text-red-600");
          } else {
            icon.classList.remove("fas", "text-red-600");
            icon.classList.add("far");
          }
          buttonElement.innerHTML = `<i class="${icon.className} mr-1"></i>${likesCount}`;
        }
        
        // Для img иконок (cards-container)
        const img = buttonElement.querySelector('img');
        if (img) {
          img.src = isLiked ? 'image/like+.png' : 'image/like.png';
          // Обновляем счетчик лайков
          const likeCount = buttonElement.querySelector('.like-count');
          if (likeCount) {
            likeCount.textContent = likesCount;
          }
        }
      }

      // Наблюдаем за изменениями в контейнере постов для настройки новых кнопок лайков
      const postsContainer = document.querySelector(".posts-container");
      if (postsContainer) {
        const observer = new MutationObserver(() => {
          setupLikeButtons();
        });
        
        observer.observe(postsContainer, {
          childList: true,
          subtree: true
        });
      }
      
      // Наблюдаем за изменениями в cards-container
      const cardsContainer = document.querySelector(".cards-container");
      if (cardsContainer) {
        const observer = new MutationObserver(() => {
          setupLikeButtons();
        });
        
        observer.observe(cardsContainer, {
          childList: true,
          subtree: true
        });
      }
      
      // Начальная настройка
      setupLikeButtons();

      // Плавная прокрутка
      const postsContainerScroll = document.querySelector(".posts-container");
      if (postsContainerScroll) {
        postsContainerScroll.addEventListener("scroll", function () {
          if (this.scrollTop > 50) {
            this.classList.add("scrolled");
          } else {
            this.classList.remove("scrolled");
          }
        });
      }
    </script>
  </body>
</html>
