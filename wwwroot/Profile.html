<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль пользователя</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          fontFamily: true,
        },
        theme: {
          extend: {
            fontFamily: {
              sans: ["Roboto", "Arial", "sans-serif"],
              serif: ["Roboto", "Arial", "sans-serif"],
              mono: ["Roboto", "Arial", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="Styles.css" />
    <style>
      .posts-container {
        max-height: calc(100vh - 280px);
        overflow-y: auto;
      }

      .posts-container::-webkit-scrollbar {
        width: 8px;
      }

      .posts-container::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }

      .posts-container::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 10px;
      }

      .posts-container::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

      /* .post-card {
        transition: transform 0.2s ease-in-out;
      } */

      /* .post-card:hover {
        transform: translateY(-2px);
      } */
    </style>
  </head>
  <body
    class="bg-gray-50 min-h-screen"
    style="display: flex; flex-direction: column; align-items: center"
  >
    <!-- Заголовок профиля -->
    <header class="bg-white border-b border-gray-200" style="width: 100%">
      <div
        style="
          width: 100%;
          padding: 0 16px;
          padding-top: 24px;
          padding-bottom: 24px;
        "
      >
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-6">
            <!-- Информация о пользователе -->
            <div>
              <div class="flex items-center space-x-2 mb-1">
                <h1 class="text-3xl font-bold text-gray-800">Иван Петров</h1>
                <span
                  id="online-indicator"
                  class="online-indicator offline"
                  title="Не в сети"
                ></span>
              </div>
              <p class="text-gray-600 mb-2">@ivan_petrov</p>
              <p class="text-gray-700 text-sm max-w-md">Веб-разработчик</p>
            </div>
          </div>

          <!-- Кнопки действий -->
          <div class="flex space-x-3">
            <button
              id="edit-profile-btn"
              class="px-6 py-0.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200"
            >
              Изменить
            </button>
            <!-- <button
              class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors duration-200 font-medium"
            >
              <i class="fas fa-cog mr-2"></i>Настройки
            </button> -->
          </div>
        </div>

        <!-- контейнер для кнопок действий -->
        <div class="action-buttons-container"></div>

        <!-- Статистика -->
        <div class="flex space-x-8 mt-6 pt-6 border-t border-gray-200">
          <div
            class="text-center"
            style="cursor: pointer"
            onclick="switchTab('posts')"
          >
            <div class="text-2xl font-bold text-gray-800">15</div>
            <div class="text-gray-600 text-sm">Постов</div>
          </div>
          <div
            class="text-center"
            style="cursor: pointer"
            onclick="switchTab('likes')"
          >
            <div class="text-2xl font-bold text-gray-800">2.3K</div>
            <div class="text-gray-600 text-sm">Понравившиеся</div>
          </div>
          <div
            class="text-center"
            style="cursor: pointer"
            onclick="switchTab('favorites')"
          >
            <div class="text-2xl font-bold text-gray-800">489</div>
            <div class="text-gray-600 text-sm">Избранное</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Контейнер с постами -->
    <main style="width: 100%; padding: 0 16px; padding-bottom: 32px">
      <!-- Вкладки -->
      <div class="bg-white rounded-lg mb-6">
        <div class="border-b border-gray-200">
          <nav class="flex px-6" aria-label="Tabs">
            <button
              class="tab-button py-3 px-6 border-2 border-blue-600 text-blue-600 font-semibold text-base rounded-32 hover:bg-blue-50 transition-colors duration-200"
              data-tab="posts"
            >
              Посты
            </button>
            <button
              class="tab-button py-3 px-6 border-2 border-gray-300 text-gray-700 font-medium text-base rounded-32 hover:bg-gray-50 transition-colors duration-200"
              data-tab="likes"
            >
              Понравившиеся
            </button>
            <button
              class="tab-button py-3 px-6 border-2 border-gray-300 text-gray-700 font-medium text-base rounded-32 hover:bg-gray-50 transition-colors duration-200"
              data-tab="favorites"
            >
              Избранное
            </button>
            <button
              class="tab-button py-3 px-6 border-2 border-gray-300 text-gray-700 font-medium text-base rounded-32 hover:bg-gray-50 transition-colors duration-200"
              data-tab="drafts"
            >
              Черновики
            </button>
          </nav>
        </div>
      </div>

      <!-- Контент вкладок -->
      <div class="bg-white rounded-lg">
        <!-- Посты -->
        <div id="posts-content" class="tab-content">
          <div class="posts-container p-6">
            <!-- Посты будут добавлены динамически -->
          </div>
        </div>

        <!-- Понравившиеся -->
        <div id="likes-content" class="tab-content hidden">
          <div class="likes-container p-6">
            <!-- Понравившиеся посты будут добавлены динамически -->
          </div>
        </div>

        <!-- Избранное -->
        <div id="favorites-content" class="tab-content hidden">
          <div class="favorites-container p-6">
            <!-- Избранные посты будут добавлены динамически -->
          </div>
        </div>

        <!-- Черновики -->
        <div id="drafts-content" class="tab-content hidden">
          <div class="drafts-container p-6">
            <!-- Черновики будут добавлены динамически -->
          </div>
        </div>
      </div>
    </main>

    <!-- Модальное окно редактирования профиля -->
    <div
      id="edit-profile-modal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
    >
      <div
        class="bg-white rounded-lg p-6 max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto"
      >
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-gray-800">Редактировать профиль</h2>
          <button
            id="close-modal-btn"
            class="text-gray-500 hover:text-gray-700"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>

        <form id="edit-profile-form">
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Заголовок</label
              >
              <input
                type="text"
                id="edit-header"
                name="header"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Ваш заголовок"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Описание</label
              >
              <textarea
                id="edit-description"
                name="description"
                rows="3"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Расскажите о себе"
              ></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Возраст</label
              >
              <input
                type="number"
                id="edit-age"
                name="age"
                min="1"
                max="120"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Ваш возраст"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Пол</label
              >
              <select
                id="edit-gender"
                name="gender"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="">Не указано</option>
                <option value="Мужской">Мужской</option>
                <option value="Женский">Женский</option>
                <option value="Другой">Другой</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Город</label
              >
              <input
                type="text"
                id="edit-city"
                name="city"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Ваш город"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Улица</label
              >
              <input
                type="text"
                id="edit-street"
                name="street"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Ваша улица"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Хобби</label
              >
              <input
                type="text"
                id="edit-hobby"
                name="hobby"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Ваше хобби"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Интересы</label
              >
              <input
                type="text"
                id="edit-interests"
                name="interests"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Ваши интересы"
              />
            </div>
          </div>

          <div class="flex justify-end space-x-3 mt-6">
            <button
              type="button"
              id="cancel-btn"
              class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors duration-200"
            >
              Отмена
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200"
            >
              Сохранить
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="OnlineStatus.js"></script>
    <script>
      // Получаем элементы модального окна
      const editProfileBtn = document.getElementById("edit-profile-btn");
      const editProfileModal = document.getElementById("edit-profile-modal");
      const closeModalBtn = document.getElementById("close-modal-btn");
      const cancelBtn = document.getElementById("cancel-btn");
      const editProfileForm = document.getElementById("edit-profile-form");

      // Функция для открытия модального окна и заполнения данными
      function openEditModal() {
        // Получаем текущие данные профиля из DOM
        const usernameElement = document.querySelector("h1");
        const bioElement = document.querySelector(
          ".text-gray-700.text-sm.max-w-md",
        );

        // Заполняем форму текущими данными
        document.getElementById("edit-header").value = "";
        document.getElementById("edit-description").value = bioElement
          ? bioElement.textContent
          : "";
        document.getElementById("edit-age").value = "";
        document.getElementById("edit-gender").value = "";
        document.getElementById("edit-city").value = "";
        document.getElementById("edit-street").value = "";
        document.getElementById("edit-hobby").value = "";
        document.getElementById("edit-interests").value = "";

        // Показываем модальное окно
        editProfileModal.classList.remove("hidden");
        editProfileModal.classList.add("flex");
      }

      // Функция для закрытия модального окна
      function closeEditModal() {
        editProfileModal.classList.add("hidden");
        editProfileModal.classList.remove("flex");
        editProfileForm.reset();
      }

      // Обработчик клика на кнопку "Изменить"
      editProfileBtn.addEventListener("click", openEditModal);

      // Обработчики клика на кнопки закрытия
      closeModalBtn.addEventListener("click", closeEditModal);
      cancelBtn.addEventListener("click", closeEditModal);

      // Закрытие модального окна при клике на затемненный фон
      editProfileModal.addEventListener("click", function (e) {
        if (e.target === editProfileModal) {
          closeEditModal();
        }
      });

      // Обработчик отправки формы
      editProfileForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        // Собираем данные из формы
        const profileData = {
          header: document.getElementById("edit-header").value,
          description: document.getElementById("edit-description").value,
          age: parseInt(document.getElementById("edit-age").value) || 0,
          gender: document.getElementById("edit-gender").value,
          city: document.getElementById("edit-city").value,
          street: document.getElementById("edit-street").value,
          hobby: document.getElementById("edit-hobby").value,
          interests: document.getElementById("edit-interests").value,
        };

        try {
          // Получение данных текущего пользователя
          const userResponse = await fetch("/User");
          if (userResponse.ok) {
            const user = await userResponse.json();
            username = user.username || user.name;
          }
          // Отправляем данные на сервер
          const response = await fetch(`/api/Profile/${username}/edit`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(profileData),
          });

          if (!response.ok) {
            throw new Error("Ошибка обновления профиля");
          }

          const updatedProfile = await response.json();
          console.log("Профиль обновлен:", updatedProfile);

          // Обновляем интерфейс с новыми данными
          if (updatedProfile.description) {
            const bioElement = document.querySelector(
              ".text-gray-700.text-sm.max-w-md",
            );
            if (bioElement) {
              bioElement.textContent = updatedProfile.description;
            }
          }

          // Закрываем модальное окно
          closeEditModal();

          // Показываем сообщение об успехе
          alert("Профиль успешно обновлен!");
        } catch (error) {
          console.error("Ошибка при обновлении профиля:", error);
          alert("Ошибка при обновлении профиля: " + error.message);
        }
      });
    </script>
    <script type="module">
      // Импортируем инициализацию профиля
      import { initializeProfile } from "./Init.js";
      import { createNavigationButtons } from "./NavigationButtons.js";

      // Вызываем инициализацию
      initializeProfile();

      // Создаем навигационные кнопки
      createNavigationButtons();
    </script>
    <script>
      // Запустить отслеживание онлайн статуса
      onlineStatus.start();

      // Функция переключения вкладок
      function switchTab(tabName) {
        // Сначала находим соответствующую кнопку вкладки и кликаем на нее
        const tabButton = document.querySelector(`[data-tab="${tabName}"]`);
        if (tabButton) {
          tabButton.click();
        }
      }

      // Функция для обновления стилей кнопок вкладок
      function updateTabButtons(activeTabName) {
        // Находим все кнопки вкладок
        const tabButtons = document.querySelectorAll(".tab-button");

        // Убираем активные стили у всех кнопок (делаем их неактивными)
        tabButtons.forEach((button) => {
          button.classList.remove(
            "border-blue-600",
            "text-blue-600",
            "font-semibold",
          );
          button.classList.add(
            "border-gray-300",
            "text-gray-700",
            "font-medium",
          );
        });

        // Добавляем активные стили для выбранной кнопки
        const activeButton = document.querySelector(
          `[data-tab="${activeTabName}"]`,
        );
        if (activeButton) {
          activeButton.classList.remove(
            "border-gray-300",
            "text-gray-700",
            "font-medium",
          );
          activeButton.classList.add(
            "border-blue-600",
            "text-blue-600",
            "font-semibold",
          );
        }
      }

      // Добавляем обработчики кликов для кнопок вкладок
      document.addEventListener("DOMContentLoaded", function () {
        const tabButtons = document.querySelectorAll(".tab-button");

        tabButtons.forEach((button) => {
          button.addEventListener("click", function () {
            const tabName = this.getAttribute("data-tab");
            updateTabButtons(tabName);
          });
        });
      });
    </script>
  </body>
</html>
