<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль пользователя</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          fontFamily: true,
        },
        theme: {
          extend: {
            fontFamily: {
              'sans': ['Roboto', 'Arial', 'sans-serif'],
              'serif': ['Roboto', 'Arial', 'sans-serif'],
              'mono': ['Roboto', 'Arial', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <link rel="stylesheet" href="Styles.css" />
    <style>
      .posts-container {
        max-height: calc(100vh - 280px);
        overflow-y: auto;
      }

      .posts-container::-webkit-scrollbar {
        width: 8px;
      }

      .posts-container::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }

      .posts-container::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 10px;
      }

      .posts-container::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

      /* .post-card {
        transition:
          transform 0.2s ease-in-out,
          box-shadow 0.2s ease-in-out;
      } */

      /* .post-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      } */
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <!-- Заголовок профиля -->
    <header class="bg-white shadow-md border-b border-gray-200">
      <div class="container mx-auto px-4 py-6">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-6">
            <!-- Информация о пользователе -->
            <div>
              <h1 class="text-3xl font-bold text-gray-800 mb-1">Иван Петров</h1>
              <p class="text-gray-600 mb-2">@ivan_petrov</p>
              <p class="text-gray-700 text-sm max-w-md">
                Веб-разработчик
              </p>
            </div>
          </div>

          <!-- Кнопки действий -->
          <div class="flex space-x-3">
            <button
              class="px-6 py-0.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200"
            >
              ✏️ Изменить
            </button>
            <!-- <button
              class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors duration-200 font-medium"
            >
              <i class="fas fa-cog mr-2"></i>Настройки
            </button> -->
          </div>
        </div>

        <!-- контейнер для кнопок действий -->
        <div class="action-buttons-container"></div>

        <!-- Статистика -->
        <div class="flex space-x-8 mt-6 pt-6 border-t border-gray-200">
          <div class="text-center">
            <div class="text-2xl font-bold text-gray-800">15</div>
            <div class="text-gray-600 text-sm">Постов</div>
          </div>
          <div class="text-center">
            <div class="text-2xl font-bold text-gray-800">2.3K</div>
            <div class="text-gray-600 text-sm">Понравившиеся</div>
          </div>
          <div class="text-center">
            <div class="text-2xl font-bold text-gray-800">489</div>
            <div class="text-gray-600 text-sm">Избранное</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Контейнер с постами -->
    <main class="container mx-auto px-4 py-8">
      <!-- Вкладки -->
      <div class="bg-white rounded-lg shadow-md mb-6">
        <div class="border-b border-gray-200">
          <nav class="flex space-x-8 px-6" aria-label="Tabs">
            <button class="tab-button py-4 px-1 border-b-2 border-blue-600 text-blue-600 font-medium text-sm" data-tab="posts">
              Посты
            </button>
            <button class="tab-button py-4 px-1 border-b-2 border-transparent text-gray-600 hover:text-gray-800 font-medium text-sm" data-tab="likes">
              Понравившиеся
            </button>
            <button class="tab-button py-4 px-1 border-b-2 border-transparent text-gray-600 hover:text-gray-800 font-medium text-sm" data-tab="favorites">
              Избранное
            </button>
          </nav>
        </div>
      </div>

      <!-- Контент вкладок -->
      <div class="bg-white rounded-lg shadow-md">
        <!-- Посты -->
        <div id="posts-content" class="tab-content">
          <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-800">Посты</h2>
          </div>
          <div class="posts-container p-6">
            <!-- Посты будут добавлены динамически -->
          </div>
        </div>

        <!-- Понравившиеся -->
        <div id="likes-content" class="tab-content hidden">
          <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-800">Понравившиеся посты</h2>
          </div>
          <div class="likes-container p-6">
            <!-- Понравившиеся посты будут добавлены динамически -->
          </div>
        </div>

        <!-- Избранное -->
        <div id="favorites-content" class="tab-content hidden">
          <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-800">Избранные посты</h2>
          </div>
          <div class="favorites-container p-6">
            <!-- Избранные посты будут добавлены динамически -->
          </div>
        </div>
      </div>
    </main>

    <script type="module">
      // Импортируем инициализацию профиля
      import { initializeProfile } from "./Init.js";
      import { createNavigationButtons } from "./NavigationButtons.js";
      
      // Вызываем инициализацию
      initializeProfile();
      
      // Создаем навигационные кнопки
      createNavigationButtons();
    </script>
  </body>
</html>
